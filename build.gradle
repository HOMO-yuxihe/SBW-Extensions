buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev.legacyforge' version '2.0.91' // 添加
    id 'org.jetbrains.kotlin.jvm' version '2.0.0'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

legacyForge {
    version = "${minecraft_version}-${forge_version}" // Forge版本

    parchment {
        minecraftVersion = project.minecraft_version
        mappingsVersion = "2023.08.13" // Parchment映射版本
    }

    runs {
        client {
            client()
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// 如果你有 mixin，保留这个块并改成你自己的文件名；没有就删掉
// mixin {
//     add sourceSets.main, "extensiontest.refmap.json"
//     config "extensiontest.mixins.json"
// }

repositories {
    maven {
        url "https://cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    maven { url = "https://maven.theillusivec4.top/" }        // Curios
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
    }

    maven {
        url = uri("https://raw.githubusercontent.com/Fuzss/modresources/main/maven/")
    }
    maven {
        url = uri("https://maven.createmod.net")
    }

    mavenCentral()
}

dependencies {
    // Curios：API 用于编译，完整版用于运行
    modRuntimeOnly "top.theillusivec4.curios:curios-forge:5.4.2+1.20.1"
    modCompileOnly "top.theillusivec4.curios:curios-forge:5.4.2+1.20.1:api"

    // GeckoLib
    modImplementation "software.bernie.geckolib:geckolib-forge-1.20.1:4.4.6"

    // 卓越前线：版本号请换成你实际使用的文件 ID
    modImplementation "curse.maven:superb-warfare-1218165:9019882"

    // Kotlin for Forge：与 SBW 0.8.9 配套的 4.11.0
    modImplementation "thedarkcolour:kotlinforforge:4.11.0"

    // 如果你启用了 Kotlin 插件，加上标准库
    modImplementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.0"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                // 如果你有 mixin，加上这行；没有就删掉
                // "MixinConfigs"            : "extensiontest.mixins.json"
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}